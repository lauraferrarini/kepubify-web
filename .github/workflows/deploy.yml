name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build kepubify.wasm
        working-directory: wasmsrc
        run: |
          go mod tidy
          GOOS=js GOARCH=wasm go build -tags zip117 -o ../docs/kepubify.wasm .

      - name: Copy Go's wasm_exec.js glue
        run: cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" docs/wasm_exec.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
