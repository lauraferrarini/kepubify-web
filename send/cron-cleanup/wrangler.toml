# Worker independente, só para a limpeza periódica do R2.
# Deploy separado do projeto Pages: `cd send/cron-cleanup && npx wrangler deploy`
name = "send2kobo-cron-cleanup"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# precisa apontar pro MESMO bucket usado pelo projeto Pages (send/wrangler.toml)
[[r2_buckets]]
binding = "FILES"
bucket_name = "send2kobo-files"

[triggers]
crons = ["*/5 * * * *"]
